# Hanafubuki core plugin

resource-world:
  # Имя мира ресурсов (как в config.yml плагина hanafubuki-resource-world → world.name)
  world: resources
  # Игрок появляется в случайной безопасной точке между min-radius и radius от спавна мира
  min-radius: 200
  radius: 3000
  max-attempts: 12

hide-from-non-ops:
  # Эти команды не-опы не видят в Tab, а при вводе получают «неизвестная команда». Опы видят всё.
  # Остальные админские команды и так защищены правами — Paper сам прячет их от тех, у кого прав нет.
  commands:
    - plugins
    - pl
    - version
    - ver
    - about
    - icanhasbukkit
  # Прятать команды с префиксом: minecraft:give, bukkit:plugins, paper:… и т.п.
  namespaced: true

help:
  # /help и /? показывают этот список вместо всех команд сервера. Цвета: &d розовый, &f белый, &7 серый.
  enabled: true
  lines:
    - "&d❀ &fКоманды &dHanafubuki"
    - "&dТелепорт"
    - "&f/spawn &7— на спавн"
    - "&f/home &7— домой, к своей кровати"
    - "&f/tpa <ник> &7— попроситься к игроку"
    - "&f/tpaccept &7/ &f/tpadeny &7— принять / отклонить запрос"
    - "&f/resources &7— в мир ресурсов"
    - "&f/rwtime &7— сколько осталось до обновления мира ресурсов"
    - "&dКарта"
    - "&f/marker add <название> &7— метка на карте на твоём месте"
    - "&f/marker list &7/ &f/marker remove <название> &7— твои метки"
    - "&dРазное"
    - "&f/sit &7/ &f/lay &7/ &f/crawl &7— сесть / лечь / ползти"
    - "&f/skin set <ник> &7— сменить скин"
    - "&f/msg <ник> <текст> &7— личное сообщение"
    - "&f/trigger ch_toggle &7— координаты на экране"
