# Hanafubuki core plugin

resource-world:
  # Имя мира ресурсов (как в config.yml плагина hanafubuki-resource-world → world.name)
  world: resources
  # Игрок появляется в случайной безопасной точке между min-radius и radius от спавна мира
  min-radius: 200
  radius: 3000
  max-attempts: 12

hide-from-non-ops:
  # Эти команды не-опы не видят в Tab, а при вводе получают «неизвестная команда». Опы видят всё.
  # Остальные админские команды и так защищены правами — Paper сам прячет их от тех, у кого прав нет.
  commands:
    # служебные команды сервера
    - plugins
    - pl
    - version
    - ver
    - about
    - icanhasbukkit
    # AuthMe: админка и 2FA (вход, регистрация, смена пароля остаются)
    - authme
    - totp
    - 2fa
    # Geyser, PlaceholderAPI, TAB
    - geyser
    - papi
    - placeholderapi
    - tab
    - btab
    # прочее
    - toggleplace
    - none
  # Прятать команды с префиксом: minecraft:give, bukkit:plugins, paper:… и т.п.
  namespaced: true
  # Все команды этих плагинов не-опы не видят и не могут вызвать (включая //wand, //set и т.п.)
  plugins: [WorldEdit, FastAsyncWorldEdit, CoreProtect, Chunky, Geyser-Spigot, PlaceholderAPI, TAB]

help:
  # /help и /? показывают только команды, доступные игроку (опы видят всё), по разделам и со страницами.
  # Разделы, описания и подсказки по аргументам — в messages.yml → help
  enabled: true
  per-page: 14
  # Никогда не показывать в /help (вход AuthMe и т.п.)
  hide: [login, l, register, reg, logout, unregister, authme, skinsrestorer]

chat:
  # Сообщения о входе и выходе в стиле сервера (тексты — в messages.yml → join / first-join / quit)
  join-quit: true

sakura-creepers:
  # С этим шансом крипер вместо взрыва рассыпается облаком лепестков сакуры — без урона и разрушений
  enabled: true
  chance: 0.25
  # Заряженные криперы тоже (по умолчанию они всегда взрываются по-настоящему)
  charged-too: false

# Команды плагина: имя, алиасы, включение. Изменения — после рестарта сервера.
commands:
  spawn:     { enabled: true, name: spawn,     aliases: [] }
  home:      { enabled: true, name: home,      aliases: [] }
  tpa:       { enabled: true, name: tpa,       aliases: [] }
  tpaaccept: { enabled: true, name: tpaaccept, aliases: [tpaccept, tpyes] }
  tpadeny:   { enabled: true, name: tpadeny,   aliases: [tpno] }
  resources: { enabled: true, name: resources, aliases: [res, ресурсы] }
  msg:       { enabled: true, name: msg,       aliases: [tell, w, whisper, m, pm] }
  reply:     { enabled: true, name: reply,     aliases: [r] }

# Palette of all messages (MiniMessage tags in messages.yml: <accent> <text> <muted> <dim> <success> <error> <gold>, <symbol>)
# Hanafubuki style: https://github.com/Hanafubuki-minecraft/hanafubuki-brand/blob/main/STYLE.md
style:
  symbol: "❀"
  accent: "#F7A1C0"
  text: "#F4EEF6"
  muted: "#A99BB5"
  dim: "#6F6480"
  success: "#A8E6B5"
  error: "#FF8A9B"
  gold: "#FFCF6B"
