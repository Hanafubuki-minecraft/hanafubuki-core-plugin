# Hanafubuki — тексты core-плагина
# Формат: MiniMessage — https://docs.advntr.dev/minimessage/format.html
# Стиль: https://github.com/Hanafubuki-minecraft/hanafubuki-brand/blob/main/STYLE.md
# Цвета — смысловые теги <accent> <text> <muted> <dim> <success> <error> <gold>, символ — <symbol>; палитра в config.yml → style

prefix: "<accent><symbol></accent> "

teleport:
  bar-spawn: "<accent><symbol></accent> <text>На спавн</text>"
  bar-home: "<accent><symbol></accent> <text>Домой</text>"
  bar-resources: "<accent><symbol></accent> <text>В мир ресурсов</text>"
  bar-tpa: "<accent><symbol></accent> <text>К <name></text>"
  done: "<muted>Готово — ты на месте.</muted>"
  cancelled: "<error>Телепорт отменён — ты сошёл с места.</error>"

home:
  no-bed: "<error>Дома пока нет — поспи в кровати, и она станет твоим <text>/home</text>.</error>"

resources:
  unavailable: "<error>Мир ресурсов сейчас недоступен.</error>"
  searching: "<muted>Ищу безопасное место…</muted>"
  failed: "<error>Не нашлось безопасного места — попробуй ещё раз.</error>"

tpa:
  usage: "<muted>Использование: <text>/tpa [ник]</text></muted>"
  not-found: "<error>Игрок <text><name></text> не в сети.</error>"
  self: "<muted>К себе телепортироваться не нужно — ты уже здесь.</muted>"
  sent: "<muted>Запрос отправлен игроку <text><name></text>.</muted>"
  request: "<text><name></text> <muted>просится к тебе.</muted> <click:run_command:'/tpaaccept'><hover:show_text:'<success>Пустить'><success>[Принять]</success></hover></click> <click:run_command:'/tpadeny'><hover:show_text:'<error>Отказать'><error>[Отклонить]</error></hover></click>"
  request-hint: "<dim>  или /tpaaccept · /tpadeny</dim>"
  none: "<muted>Запросов на телепорт нет.</muted>"
  accepted-target: "<success>Запрос принят — <name> уже в пути.</success>"
  accepted-sender: "<success><name> принимает запрос — не двигайся.</success>"
  denied-target: "<muted>Запрос от <text><name></text> отклонён.</muted>"
  denied-sender: "<error><name> отклоняет запрос.</error>"

whisper:
  usage: "<muted>Использование: <text>/msg [ник] [текст]</text></muted>"
  reply-usage: "<muted>Использование: <text>/r [текст]</text></muted>"
  not-found: "<error>Игрок <text><name></text> не в сети.</error>"
  self: "<muted>Себе писать не нужно.</muted>"
  no-reply: "<muted>Пока некому ответить — сначала напиши через <text>/msg</text>.</muted>"
  console-name: "Сервер"
  to: "<accent>✉ ты → <name></accent> <dim>·</dim> <text><message></text>"
  from: "<click:suggest_command:'/r '><hover:show_text:'<muted>Ответить'><accent>✉ <name> → тебе</accent> <dim>·</dim> <text><message></text></hover></click>"

admin:
  reloaded: "<success>Конфиг и тексты перезагружены.</success> <dim>Имена команд меняются только после рестарта.</dim>"
  version: "<muted>Hanafubuki <text><version></text></muted>"
  usage: "<muted>Использование: <text>/<label> reload</text> <dim>·</dim> <text>/<label> version</text></muted>"

gamerules:
  synced: "<muted>Правило <text><rule> = <value></text> действует во всех мирах <dim>(<count>/<total>)</dim>.</muted>"

join: "<dim><accent><symbol></accent> <name> заходит на сервер</dim>"
first-join: "<accent><symbol> Встречайте <text><name></text> — впервые на Hanafubuki!</accent>"
quit: "<dim><symbol> <name> покидает сервер</dim>"

unknown-command: "<error>Неизвестная команда. Список доступных — <text>/help</text>.</error>"

# /help — собирается сам из команд, доступных игроку. Здесь — оформление, разделы и описания.
help:
  header: "<accent><symbol> Hanafubuki</accent> <dim>· команды · <page>/<pages></dim>"
  group: "<accent><title></accent>"
  entry: " <click:suggest_command:'<suggest>'><hover:show_text:'<muted>Нажми, чтобы подставить'><text><usage></text></hover></click> <dim>—</dim> <muted><desc></muted>"
  entry-plain: " <click:suggest_command:'<suggest>'><hover:show_text:'<muted>Нажми, чтобы подставить'><text><usage></text></hover></click>"
  nav: "  <prev>  <next>"
  prev: "<click:run_command:'<target>'><accent>‹ назад</accent></click>"
  next: "<click:run_command:'<target>'><accent>дальше ›</accent></click>"
  prev-off: "<dim>‹ назад</dim>"
  next-off: "<dim>дальше ›</dim>"
  hint: "<dim>  нажми на команду, чтобы подставить её в чат</dim>"
  op-hint: "<dim>  ты оп — видны все команды сервера</dim>"
  other: "Другое"
  # Разделы по порядку. В commands — имена команд (для команд этого плагина — их id из config.yml → commands)
  groups:
    teleport:
      title: "Телепорт"
      commands: [spawn, home, tpa, tpaaccept, tpadeny, resources, rwtime]
    map:
      title: "Карта"
      commands: [marker]
    chat:
      title: "Общение"
      commands: [msg, reply, list, me]
    rest:
      title: "Отдых и вид"
      commands: [sit, lay, crawl, bellyflop, spin, gspin, skin, skins, trigger]
  # Как показывать команду с аргументами (иначе — просто /имя)
  usage:
    tpa: "/tpa [ник]"
    msg: "/msg [ник] [текст]"
    reply: "/r [текст]"
    marker: "/marker add [название]"
    skin: "/skin set [ник]"
    trigger: "/trigger ch_toggle"
    changepassword: "/changepassword [старый] [новый]"
  # Описания (иначе — описание из самого плагина)
  desc:
    spawn: "на спавн"
    home: "домой, к своей кровати"
    tpa: "попроситься к игроку"
    tpaaccept: "принять запрос на телепорт"
    tpadeny: "отклонить запрос"
    resources: "в мир ресурсов"
    rwtime: "когда мир ресурсов обновится"
    marker: "метки на карте: add, list, remove"
    msg: "личное сообщение"
    reply: "ответить на последнее личное"
    list: "кто сейчас онлайн"
    me: "действие от третьего лица"
    sit: "сесть"
    lay: "лечь"
    crawl: "ползти"
    bellyflop: "лечь на живот"
    spin: "покрутиться"
    skin: "сменить скин"
    skins: "меню скинов"
    gspin: "покрутиться"
    gsit: "настройки сидения"
    changepassword: "сменить пароль"
    trigger: "координаты на экране и другие датапаки"
    geyser: "команды для Bedrock"
